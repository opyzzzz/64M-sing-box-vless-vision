name: Sync sing-box Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version: latest, 1.13.21 or v1.13.21"
        required: true
        default: "latest"
        type: string
      force:
        description: "Overwrite existing Release assets"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: sync-sing-box
  cancel-in-progress: false

permissions:
  contents: write

env:
  SOURCE_REPO: SagerNet/sing-box

jobs:
  sync:
    name: Sync sing-box
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version || 'latest' }}
        run: |
          set -e
          INPUT_VERSION="$(echo "$INPUT_VERSION" | xargs)"
          [ -n "$INPUT_VERSION" ] || { echo "::error::Version cannot be empty."; exit 1; }
          VERSION_INPUT="${INPUT_VERSION#v}"

          if [ "$VERSION_INPUT" = "latest" ]; then
            SOURCE_TAG="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPO}/releases/latest" | jq -r '.tag_name')"
          else
            SOURCE_TAG="v${VERSION_INPUT}"
            CHECKED_TAG="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPO}/releases/tags/${SOURCE_TAG}" | jq -r '.tag_name')"
            [ "$CHECKED_TAG" = "$SOURCE_TAG" ] || { echo "::error::Release not found: $SOURCE_TAG"; exit 1; }
          fi

          [ -n "$SOURCE_TAG" ] && [ "$SOURCE_TAG" != "null" ] || { echo "::error::Unable to resolve sing-box version."; exit 1; }

          VERSION="${SOURCE_TAG#v}"
          TARGET_TAG="$VERSION"
          RELEASE_TITLE="${VERSION}-musl"
          AMD64_ASSET="sing-box-${VERSION}-linux-amd64-musl.tar.gz"
          ARM64_ASSET="sing-box-${VERSION}-linux-arm64-musl.tar.gz"

          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "amd64_asset=$AMD64_ASSET" >> "$GITHUB_OUTPUT"
          echo "arm64_asset=$ARM64_ASSET" >> "$GITHUB_OUTPUT"

      - name: Check target Release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.version.outputs.target_tag }}
          FORCE: ${{ inputs.force || false }}
        shell: bash
        run: |
          set -e
          if gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Release already exists: $TARGET_TAG"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check official assets
        if: steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.version.outputs.source_tag }}
          AMD64_ASSET: ${{ steps.version.outputs.amd64_asset }}
          ARM64_ASSET: ${{ steps.version.outputs.arm64_asset }}
        shell: bash
        run: |
          set -e
          gh api "repos/${SOURCE_REPO}/releases/tags/${SOURCE_TAG}" --jq '.assets[].name' | tee /tmp/assets.txt
          grep -Fxq "$AMD64_ASSET" /tmp/assets.txt || { echo "::error::AMD64 asset not found: $AMD64_ASSET"; exit 1; }
          grep -Fxq "$ARM64_ASSET" /tmp/assets.txt || { echo "::error::ARM64 asset not found: $ARM64_ASSET"; exit 1; }

      - name: Download official packages
        if: steps.target.outputs.skip != 'true'
        env:
          SOURCE_TAG: ${{ steps.version.outputs.source_tag }}
          AMD64_ASSET: ${{ steps.version.outputs.amd64_asset }}
          ARM64_ASSET: ${{ steps.version.outputs.arm64_asset }}
        shell: bash
        run: |
          set -e
          mkdir -p download
          curl -fL --retry 5 -o "download/${AMD64_ASSET}" "https://github.com/${SOURCE_REPO}/releases/download/${SOURCE_TAG}/${AMD64_ASSET}"
          curl -fL --retry 5 -o "download/${ARM64_ASSET}" "https://github.com/${SOURCE_REPO}/releases/download/${SOURCE_TAG}/${ARM64_ASSET}"
          ls -lh download/

      - name: Verify archives
        if: steps.target.outputs.skip != 'true'
        shell: bash
        run: |
          set -e
          gzip -t download/*.tar.gz
          for file in download/*.tar.gz; do tar -tzf "$file" >/dev/null; done

      - name: Extract sing-box
        if: steps.target.outputs.skip != 'true'
        env:
          AMD64_ASSET: ${{ steps.version.outputs.amd64_asset }}
          ARM64_ASSET: ${{ steps.version.outputs.arm64_asset }}
        shell: bash
        run: |
          set -e
          mkdir -p extract/amd64 extract/arm64 output
          tar -xzf "download/${AMD64_ASSET}" -C extract/amd64
          tar -xzf "download/${ARM64_ASSET}" -C extract/arm64
          AMD64_BIN="$(find extract/amd64 -type f -name sing-box -print -quit)"
          ARM64_BIN="$(find extract/arm64 -type f -name sing-box -print -quit)"
          [ -n "$AMD64_BIN" ] || { echo "::error::AMD64 sing-box binary not found."; exit 1; }
          [ -n "$ARM64_BIN" ] || { echo "::error::ARM64 sing-box binary not found."; exit 1; }
          cp "$AMD64_BIN" output/sing-box-amd64
          cp "$ARM64_BIN" output/sing-box-arm64
          chmod 755 output/sing-box-amd64 output/sing-box-arm64
          ls -lh output/

      - name: Validate binaries
        if: steps.target.outputs.skip != 'true'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -e
          file output/sing-box-amd64
          file output/sing-box-arm64
          output/sing-box-amd64 version
          ACTUAL_VERSION="$(output/sing-box-amd64 version | sed -n 's/^sing-box version \([^ ]*\).*$/\1/p' | head -n 1)"
          echo "Expected: ${EXPECTED_VERSION}"
          echo "Actual:   ${ACTUAL_VERSION}"
          [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] || { echo "::error::Version mismatch."; exit 1; }

      - name: Generate SHA256
        if: steps.target.outputs.skip != 'true'
        shell: bash
        run: |
          set -e
          cd output
          sha256sum sing-box-amd64 sing-box-arm64 > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update Release
        if: steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.version.outputs.source_tag }}
          TARGET_TAG: ${{ steps.version.outputs.target_tag }}
          RELEASE_TITLE: ${{ steps.version.outputs.release_title }}
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ inputs.force || false }}
        shell: bash
        run: |
          set -e
          cat > release-notes.md <<EOF
          ## sing-box ${SOURCE_TAG} musl

          Automatically extracted from the official SagerNet/sing-box release.

          Source:
          https://github.com/SagerNet/sing-box/releases/tag/${SOURCE_TAG}

          Official packages:

          - sing-box-${VERSION}-linux-amd64-musl.tar.gz
          - sing-box-${VERSION}-linux-arm64-musl.tar.gz

          Published binaries:

          - sing-box-amd64
          - sing-box-arm64
          - SHA256SUMS
          EOF

          if gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [ "$FORCE" = "true" ] || { echo "::error::Release ${TARGET_TAG} already exists. Use force=true to overwrite."; exit 1; }
            gh release upload "$TARGET_TAG" output/sing-box-amd64 output/sing-box-arm64 output/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" --notes-file release-notes.md
          else
            gh release create "$TARGET_TAG" output/sing-box-amd64 output/sing-box-arm64 output/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" --notes-file release-notes.md
          fi

          echo "Release completed: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TARGET_TAG}"

      - name: Summary
        if: always()
        env:
          SOURCE_TAG: ${{ steps.version.outputs.source_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_TAG: ${{ steps.version.outputs.target_tag }}
          SKIP: ${{ steps.target.outputs.skip }}
          FORCE: ${{ inputs.force || false }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "# sing-box Release Sync"
            echo
            if [ "$SKIP" = "true" ]; then
              echo "## Status: SKIPPED"
              echo
              echo "The target Release already exists."
              echo
              echo "| Item | Value |"
              echo "|---|---|"
              echo "| Source | ${SOURCE_TAG} |"
              echo "| Version | ${VERSION} |"
              echo "| Target | ${TARGET_TAG} |"
              echo "| Force | ${FORCE} |"
              echo "| Action | No changes |"
            elif [ "$JOB_STATUS" = "success" ]; then
              echo "## Status: SUCCESS"
              echo
              echo "Release synchronized successfully."
              echo
              echo "| Item | Value |"
              echo "|---|---|"
              echo "| Source | ${SOURCE_TAG} |"
              echo "| Version | ${VERSION} |"
              echo "| Target | ${TARGET_TAG} |"
              echo "| AMD64 | sing-box-amd64 |"
              echo "| ARM64 | sing-box-arm64 |"
              echo "| Checksums | SHA256SUMS |"
            else
              echo "## Status: FAILED"
              echo
              echo "The sync workflow did not complete successfully."
              echo
              echo "| Item | Value |"
              echo "|---|---|"
              echo "| Source | ${SOURCE_TAG:-unknown} |"
              echo "| Version | ${VERSION:-unknown} |"
              echo "| Target | ${TARGET_TAG:-unknown} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
